<!DOCTYPE html>
<!--
  沙袋 · 打个痛快 —— 单文件网页，零依赖、不联网、不存战绩。

  打击字幕语料来自 cndiandian/zuanbot.com（骂人宝典 / 祖安语录）
  https://github.com/cndiandian/zuanbot.com —— Apache License 2.0
  本项目只取了它的 min（口吐芬芳）档，并自行做了筛选与净化：
  剔除涉家人、涉性、涉死亡自伤、涉疾病残疾的句子，去掉 8-40 字以外的长短句，去重。
  运行时不再做任何替换，净化在语料层一次做完。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d0b">
<title>沙袋 · 打个痛快</title>
<!-- 内嵌图标：避免浏览器自动去要 favicon.ico 而报 404，也不产生任何外部请求 -->
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMDAgMTAwJz48cmVjdCB3aWR0aD0nMTAwJyBoZWlnaHQ9JzEwMCcgcng9JzI0JyBmaWxsPScjMWIxMjBmJy8+PHJlY3QgeD0nNDcnIHk9JzUnIHdpZHRoPSc2JyBoZWlnaHQ9JzE3JyByeD0nMycgZmlsbD0nI2JkYjNhNicvPjxyZWN0IHg9JzMzJyB5PScxOCcgd2lkdGg9JzM0JyBoZWlnaHQ9JzcyJyByeD0nMTcnIGZpbGw9JyNhODQ1MmYnLz48cmVjdCB4PSc0MScgeT0nMjYnIHdpZHRoPSc2JyBoZWlnaHQ9JzU2JyByeD0nMycgZmlsbD0nI2M5NjM0YScgb3BhY2l0eT0nLjU1Jy8+PC9zdmc+">
<style>
  :root {
    --pivot: 6vh;
    --chain-h: 9vh;
    --rig-w: min(34vw, 24vh);
    --bag-h: min(60vh, 76vw);
    --ink: #e8ddd4;
    --dim: #9c8b7e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 12%, #33241d 0%, #1a1210 45%, #0d0908 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  #shake {
    position: absolute;
    inset: 0;
    will-change: transform;
  }

  /* ---------- 顶部支架（固定不动，作为摆动支点） ---------- */

  #mount {
    position: absolute;
    left: 50%;
    top: var(--pivot);
    width: 76px;
    height: 14px;
    margin-left: -38px;
    margin-top: -7px;
    border-radius: 7px;
    background: linear-gradient(180deg, #a49a8e 0%, #645b52 45%, #322c27 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .75), inset 0 1px 0 rgba(255, 255, 255, .35);
  }

  #mount::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border: 3px solid #bdb3a6;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .6), inset 0 0 4px rgba(0, 0, 0, .4);
  }

  /* ---------- 会摆动的部分 ---------- */

  #rig {
    position: absolute;
    left: 50%;
    top: var(--pivot);
    width: var(--rig-w);
    margin-left: calc(var(--rig-w) / -2);
    transform-origin: 50% 0;
    will-change: transform;
  }

  #chain {
    width: 6px;
    height: var(--chain-h);
    margin: 0 auto;
    border-radius: 3px;
    background: repeating-linear-gradient(180deg,
      #d8d0c4 0px, #d8d0c4 5px,
      #6d6559 5px, #6d6559 9px,
      rgba(0, 0, 0, 0) 9px, rgba(0, 0, 0, 0) 11px);
    filter: drop-shadow(0 0 4px rgba(0, 0, 0, .8));
    opacity: .92;
  }

  #bag {
    position: relative;
    width: 100%;
    height: var(--bag-h);
    border-radius: 999px;
    background: linear-gradient(90deg,
      #2b120d 0%,
      #6b2a20 14%,
      #a8452f 38%,
      #c9634a 48%,
      #a8452f 58%,
      #5e241a 84%,
      #230f0a 100%);
    box-shadow:
      inset 0 20px 34px -14px rgba(0, 0, 0, .55),
      inset 0 -26px 38px -16px rgba(0, 0, 0, .65),
      0 30px 60px -20px rgba(0, 0, 0, .85);
    cursor: crosshair;
    will-change: filter;
  }

  /* 横向缝线，做出皮面的分节感 */
  #bag::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: repeating-linear-gradient(180deg,
      rgba(0, 0, 0, .22) 0px, rgba(0, 0, 0, .22) 2px,
      rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 10px);
    opacity: .55;
    pointer-events: none;
  }

  /* 侧向高光 */
  #bag::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(96deg,
      rgba(255, 255, 255, 0) 26%,
      rgba(255, 216, 190, .17) 44%,
      rgba(255, 255, 255, 0) 60%);
    pointer-events: none;
  }

  #bagCap {
    position: absolute;
    left: 50%;
    top: 8px;
    width: 66%;
    height: 28px;
    margin-left: -33%;
    border-radius: 50%;
    background: linear-gradient(180deg, #58241a 0%, #2a1009 100%);
    box-shadow: 0 8px 16px rgba(0, 0, 0, .55), inset 0 -4px 8px rgba(0, 0, 0, .55);
    pointer-events: none;
  }

  #dents, #cracks {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    pointer-events: none;
  }

  /* 印在沙袋上的名字 */
  #bagName {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    z-index: 2;
    max-width: 84%;
    padding: 7px 18px;
    border-radius: 13px;
    border: 1px solid rgba(255, 214, 190, .18);
    background: rgba(18, 9, 7, .46);
    color: #ffe6d2;
    font-weight: 800;
    letter-spacing: .06em;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .85);
    cursor: crosshair;
    transition: border-color .15s ease, background .15s ease;
  }

  #bagName[data-len="short"] { font-size: clamp(18px, 3.4vw, 30px); }
  #bagName[data-len="long"]  { font-size: clamp(14px, 2.4vw, 19px); }

  body.idle #bagName { cursor: pointer; }
  body.idle #bagName:hover {
    border-color: rgba(255, 214, 190, .5);
    background: rgba(18, 9, 7, .66);
  }

  #bagName::after {
    content: "点这里改名";
    position: absolute;
    left: 50%;
    bottom: -22px;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    color: #f0d3bb;
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .15s ease;
  }

  body.idle #bagName:hover::after { opacity: .75; }

  .dent {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%,
      rgba(0, 0, 0, .66) 0%,
      rgba(0, 0, 0, .34) 45%,
      rgba(0, 0, 0, 0) 72%);
    animation: dentFade .7s ease-out forwards;
  }

  @keyframes dentFade {
    0%   { opacity: 0; transform: scale(.5); }
    22%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.08); }
  }

  #chips {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .chip {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 1px;
    pointer-events: none;
    will-change: transform, opacity;
  }

  #taunts {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .taunt {
    position: absolute;
    width: max-content;         /* 否则 left:50% 会把可用宽度砍掉一半，长句会被迫折成四行 */
    max-width: min(86vw, 560px);
    font-size: min(var(--fs, 18px), 5.6vw);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: .02em;
    text-align: center;
    color: #ffd9a8;
    padding: 4px 14px;
    border-radius: 14px;
    background: rgba(14, 8, 6, .62);
    text-shadow: 0 2px 12px rgba(0, 0, 0, .95);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .55);
    animation: tauntRise 1.1s ease-out forwards;
  }

  .taunt.plain { color: #b9a99c; font-weight: 600; }

  @keyframes tauntRise {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.86); }
    14%  { opacity: 1; transform: translate(-50%, -58%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
  }

  /* ---------- 顶部状态条 ---------- */

  #hud {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    display: flex;
    gap: clamp(16px, 4vw, 44px);
    padding: calc(14px + env(safe-area-inset-top)) clamp(14px, 4vw, 34px) 14px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(8, 5, 4, .72) 0%, rgba(8, 5, 4, 0) 100%);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 62px;
  }

  .stat .k {
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--dim);
  }

  .stat .v {
    font-size: clamp(20px, 3.2vw, 30px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    transition: color .18s ease;
  }

  #mute {
    position: fixed;
    right: calc(12px + env(safe-area-inset-right));
    top: calc(12px + env(safe-area-inset-top));
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 12px;
    background: rgba(255, 255, 255, .06);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }

  #mute:hover { background: rgba(255, 255, 255, .12); }
  #mute:active { transform: scale(.93); }

  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--dim);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .5s ease;
  }

  #hint.off { opacity: 0; }

  /* ---------- 起名 / 改名弹窗 ---------- */

  #dialog {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(6, 4, 3, .74);
    animation: dialogIn .18s ease-out;
  }

  #dialog[hidden] { display: none; }

  #dialog form {
    width: min(92vw, 380px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 22px;
    border-radius: 18px;
    border: 1px solid rgba(255, 214, 190, .14);
    background: linear-gradient(180deg, #2c1d17 0%, #1a110e 100%);
    box-shadow: 0 30px 70px -22px rgba(0, 0, 0, .95);
  }

  #dialog h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
  }

  #dialog p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--dim);
  }

  #nameInput {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 214, 190, .22);
    background: rgba(0, 0, 0, .38);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;          /* 16px 以下 iOS 聚焦会自动放大页面 */
    -webkit-user-select: text;
    user-select: text;
  }

  #nameInput:focus {
    outline: none;
    border-color: #ff9d55;
  }

  .dialog-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .dialog-actions button {
    padding: 10px 18px;
    border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .06);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }

  .dialog-actions button:hover { background: rgba(255, 255, 255, .12); }
  .dialog-actions button:active { transform: scale(.96); }

  #nameOk {
    border-color: transparent;
    background: linear-gradient(180deg, #c9634a 0%, #a8452f 100%);
    font-weight: 700;
  }

  @keyframes dialogIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="shake">
    <div id="mount"></div>

    <div id="rig">
      <div id="chain"></div>
      <div id="bag">
        <div id="bagCap"></div>
        <div id="dents"></div>
        <svg id="cracks" viewBox="0 0 300 600" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="bagName"></div>
      </div>
    </div>

    <div id="taunts"></div>
  </div>
  <div id="chips"></div>
</div>

<header id="hud">
  <div class="stat"><span class="k">连击</span><span class="v" id="combo">0</span></div>
  <div class="stat"><span class="k">总伤害</span><span class="v" id="damage">0</span></div>
  <div class="stat"><span class="k">最高连击</span><span class="v" id="best">0</span></div>
</header>

<button id="mute" type="button" aria-label="关闭音效">🔊</button>
<div id="hint">点击沙袋出拳 · 空格键也行 · 想改名就点沙袋上的名字</div>

<div id="dialog" hidden>
  <form id="dialogForm">
    <h2 id="dialogTitle">给沙袋起个名字</h2>
    <p id="dialogDesc">以后骂的就是它了，名字会印在沙袋上</p>
    <input id="nameInput" type="text" maxlength="8" autocomplete="off" spellcheck="false"
           placeholder="老板 / 甲方 / 生活">
    <div class="dialog-actions">
      <button type="button" id="nameSkip">跳过</button>
      <button type="submit" id="nameOk">就这么叫</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 可调参数 ==================== */

  const CONFIG = {
    // 连击
    comboTimeout: 900,          // ms，超过这么久没出拳就断连
    damageBase: 10,             // 单拳基础伤害
    damagePerCombo: 2,          // 每层连击增加的伤害
    damagePerComboMax: 90,      // 连击加成上限

    // 摆动
    impulseBase: 58,            // 基础角速度冲量 deg/s
    impulsePerCombo: 2.6,       // 每层连击增加
    impulseJitter: 0.16,        // 随机浮动
    impulseCap: 260,            // 角速度上限
    angleCap: 42,               // 最大摆角
    spring: 60,                 // 弹簧刚度
    damping: 6.5,               // 阻尼（欠阻尼，会自然回摆几下）

    // 画面反馈
    shakePerHit: 1.6,
    shakeMax: 9,
    shakeDecay: 7.5,
    dentLife: 700,
    dentsMax: 24,
    particlesPerHit: 5,
    particlesMax: 60,
    particleLife: 0.7,
    particleGravity: 1400,
    tauntLife: 1100,
    tauntLifeMax: 2200,         // 长句多停留一会儿的上限
    tauntsMax: 3,
    tauntGap: 520,              // 两条吐槽之间的最小间隔 ms，避免糊成一团
    tauntLanes: 3,              // 吐槽分几层，避免上下重叠
    crackEvery: 20,             // 每命中多少次叠一条裂纹
    cracksMax: 14,
    darkenSpan: 9000,           // 总伤害到这个数，沙袋暗到下限
    darkenMax: 0.28,            // 最暗到 72% 亮度

    // 音频
    masterGain: 0.35,
    maxVoices: 8,               // 同时发声数上限
    rattleSpeed: 120,           // 回摆速度超过它才响铁链
    rattleGap: 120              // 铁链响的最小间隔 ms
  };

  /* ==================== 打击字幕语料 ==================== */

  // 来源：cndiandian/zuanbot.com（骂人宝典 / 祖安语录，Apache-2.0）的 min 档。

  // 打击时从中纯随机抽一条，前面拼上沙袋的名字。

    '别人站着赚钱， 你躺着。',

    '等我有钱了，我就带你去最好的神经病院。',

  /* ==================== 合成音效（无任何音频文件） ==================== */

  let actx = null;
  let master = null;
  let muted = false;
  let noiseBuffer = null;
  let voices = [];

  function ensureAudio() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : CONFIG.masterGain;
    master.connect(actx.destination);
    return actx;
  }

  function getNoise(ctx) {
    if (noiseBuffer) return noiseBuffer;
    const len = Math.floor(ctx.sampleRate * 0.5);
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }

  // 记录一组正在发声的节点，超过上限就把最旧的一组掐掉，防止狂点时爆音
  function trackVoices(nodes, endTime) {
    const now = actx.currentTime;
    voices = voices.filter((v) => v.end > now);
    voices.push({ nodes: nodes, end: endTime });
    while (voices.length > CONFIG.maxVoices) {
      const old = voices.shift();
      for (const n of old.nodes) { try { n.stop(); } catch (err) { /* 已经停了 */ } }
    }
  }

  function playPunch(comboCount) {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    const t = ctx.currentTime;
    const heat = Math.min(comboCount, 40) / 40;      // 0~1，连击越高越"热"
    const base = 52 + Math.random() * 18 + heat * 16;
    const nodes = [];

    // 低频闷响：出拳的主体重量感
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(28, base * 0.55), t + 0.18);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.0001, t);
    oscGain.gain.exponentialRampToValueAtTime(0.95, t + 0.006);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(oscGain).connect(master);
    osc.start(t);
    osc.stop(t + 0.24);
    nodes.push(osc);

    // 低通噪声：皮革被拍中的那一下
    const slap = ctx.createBufferSource();
    slap.buffer = getNoise(ctx);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(320 + heat * 900, t);
    lp.Q.value = 0.9;
    const slapGain = ctx.createGain();
    slapGain.gain.setValueAtTime(0.0001, t);
    slapGain.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
    slapGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    slap.connect(lp).connect(slapGain).connect(master);
    slap.start(t);
    slap.stop(t + 0.12);
    nodes.push(slap);

    // 连击越亮：叠一层更清脆的击打声
    if (heat > 0.05) {
      const bright = ctx.createOscillator();
      bright.type = 'triangle';
      bright.frequency.setValueAtTime(base * 2.6, t);
      bright.frequency.exponentialRampToValueAtTime(base * 1.8, t + 0.06);
      const brightGain = ctx.createGain();
      brightGain.gain.setValueAtTime(0.0001, t);
      brightGain.gain.exponentialRampToValueAtTime(0.02 + heat * 0.1, t + 0.004);
      brightGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      bright.connect(brightGain).connect(master);
      bright.start(t);
      bright.stop(t + 0.11);
      nodes.push(bright);

      const tick = ctx.createBufferSource();
      tick.buffer = getNoise(ctx);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1600 + heat * 2200;
      bp.Q.value = 2.4;
      const tickGain = ctx.createGain();
      tickGain.gain.setValueAtTime(0.0001, t);
      tickGain.gain.exponentialRampToValueAtTime(0.01 + heat * 0.07, t + 0.003);
      tickGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      tick.connect(bp).connect(tickGain).connect(master);
      tick.start(t);
      tick.stop(t + 0.08);
      nodes.push(tick);
    }

    trackVoices(nodes, t + 0.26);
  }

  function playRattle() {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = getNoise(ctx);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 3400;
    bp.Q.value = 8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(bp).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.09);

    trackVoices([src], t + 0.1);
  }

  function playMiss() {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = getNoise(ctx);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(1300, t);
    bp.frequency.exponentialRampToValueAtTime(260, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    src.connect(bp).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.2);

    trackVoices([src], t + 0.21);
  }

  function spawnDent(localX, localY) {
    const w = bag.offsetWidth * (0.1 + Math.random() * 0.06);
    const el = document.createElement('div');
    el.className = 'dent';
    el.style.width = w + 'px';
    el.style.height = w + 'px';
    el.style.left = (localX - w / 2) + 'px';
    el.style.top = (localY - w / 2) + 'px';
    dentLayer.appendChild(el);
    dentEls.push(el);

    el.addEventListener('animationend', () => {
      el.remove();
      const i = dentEls.indexOf(el);
      if (i >= 0) dentEls.splice(i, 1);
    });

    while (dentEls.length > CONFIG.dentsMax) {
      const old = dentEls.shift();
      if (old) old.remove();
    }
  }

  function spawnChips(stageX, stageY) {
    for (let i = 0; i < CONFIG.particlesPerHit; i++) {
      const size = 3 + Math.random() * 4;
      const el = document.createElement('div');
      el.className = 'chip';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = 'hsl(' + (16 + Math.random() * 16).toFixed(0) + ', ' +
        (45 + Math.random() * 25).toFixed(0) + '%, ' + (26 + Math.random() * 18).toFixed(0) + '%)';
      chipLayer.appendChild(el);

      chipEls.push({
        el: el,
        x: stageX,
        y: stageY,
        vx: (Math.random() * 2 - 1) * 240,
        vy: -80 - Math.random() * 230,
        rot: Math.random() * 360,
        vr: (Math.random() * 2 - 1) * 720,
        life: CONFIG.particleLife,
        max: CONFIG.particleLife
      });
    }

    while (chipEls.length > CONFIG.particlesMax) {
      const old = chipEls.shift();
      if (old) old.el.remove();
    }
  }

  function updateChips(dt) {
    for (let i = chipEls.length - 1; i >= 0; i--) {
      const p = chipEls[i];
      p.life -= dt;
      if (p.life <= 0) {
        p.el.remove();
        chipEls.splice(i, 1);
        continue;
      }
      p.vy += CONFIG.particleGravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(0) + 'deg)';
      p.el.style.opacity = (p.life / p.max).toFixed(2);
    }
  }

  function pickFrom(pool) {
    for (let attempt = 0; attempt < 12; attempt++) {
      const text = pool[Math.floor(Math.random() * pool.length)];
      if (recentTaunts.indexOf(text) === -1) {
        recentTaunts.push(text);
        while (recentTaunts.length > 3) recentTaunts.shift();
        return text;
      }
    }
    return pool[0];
  }

  // 句子越长字号越小，保证 40 字的长句在窄屏上最多折成两行
  function tauntSize(len) {
    if (len <= 16) return '21px';
    if (len <= 24) return '18px';
    if (len <= 32) return '16px';
    return '14px';
  }

  function spawnTaunt(text, plain) {
    const stageRect = stage.getBoundingClientRect();
    const bagRect = bag.getBoundingClientRect();

    const el = document.createElement('div');
    el.className = plain ? 'taunt plain' : 'taunt';
    el.textContent = text;

    const chars = Array.from(text).length;
    el.style.setProperty('--fs', tauntSize(chars));
    // 长句会折行，按字数多留一点时间，不然 1.1 秒根本来不及看
    el.style.animationDuration =
      Math.min(CONFIG.tauntLifeMax, CONFIG.tauntLife + Math.max(0, chars - 18) * 45) + 'ms';

    // 左右交替 + 分层，保证同时冒出来的几条不会糊在一起
    const lane = tauntLane % CONFIG.tauntLanes;
    tauntLane += 1;
    const side = lane % 2 === 0 ? 1 : -1;
    const centerX = bagRect.left - stageRect.left + bagRect.width / 2;
    const spread = Math.max(bagRect.width * 0.46, stageRect.width * 0.09);
    const x = centerX + side * spread * (0.85 + Math.random() * 0.5);
    const y = bagRect.top - stageRect.top +
      bagRect.height * (0.04 + lane * 0.075 + Math.random() * 0.02);

    el.style.top = y + 'px';
    tauntLayer.appendChild(el);

    // 长句会折行，得按实际宽度把它收进屏幕内
    const half = el.offsetWidth / 2 + 8;
    el.style.left = clamp(x, half, Math.max(half, stageRect.width - half)) + 'px';

    tauntEls.push(el);
    lastTauntAt = performance.now();

    el.addEventListener('animationend', () => {
      el.remove();
      const i = tauntEls.indexOf(el);
      if (i >= 0) tauntEls.splice(i, 1);
    });

    while (tauntEls.length > CONFIG.tauntsMax) {
      const old = tauntEls.shift();
      if (old) old.remove();
    }
  }

  function tauntDue(c) {
    if (c < 3) return false;
    if (c < 10) return c % 3 === 0;
    if (c < 25) return c % 5 === 0;
    if (c < 50) return c % 8 === 0;
    return c % 10 === 0;
  }

  function addCrack() {
    if (crackCount >= CONFIG.cracksMax) return;
    crackCount++;

    let x = 60 + Math.random() * 180;
    let y = 120 + Math.random() * 340;
    const pts = [[x, y]];
    const segs = 4 + Math.floor(Math.random() * 4);
    let ang = Math.PI * (0.25 + Math.random() * 0.5);

    for (let i = 0; i < segs; i++) {
      ang += (Math.random() * 2 - 1) * 0.7;
      const len = 18 + Math.random() * 30;
      x = clamp(x + Math.cos(ang) * len, 8, 292);
      y = clamp(y + Math.sin(ang) * len, 8, 592);
      pts.push([x, y]);
    }

    const line = document.createElementNS(SVG_NS, 'polyline');
    line.setAttribute('points', pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'rgba(22,10,7,0.74)');
    line.setAttribute('stroke-width', (1.4 + Math.random() * 1.2).toFixed(2));
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('vector-effect', 'non-scaling-stroke');
    crackSvg.appendChild(line);

    if (line.animate && !reducedMotion) {
      line.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease-out' });
    }
  }

  function applyDamageTint() {
    const dark = Math.min(totalDamage / CONFIG.darkenSpan, 1) * CONFIG.darkenMax;
    bag.style.filter = 'brightness(' + (1 - dark).toFixed(3) + ')';
  }

  /* ==================== 起名 / 改名 ==================== */

  function loadSavedName() {
    try {
      return (window.localStorage.getItem(NAME_KEY) || '').trim() || null;
    } catch (err) {
      return null;            // 隐私模式下读不到，就当没起过名
    }
  }

  function saveName(name) {
    try {
      window.localStorage.setItem(NAME_KEY, name);
    } catch (err) {
      /* 存不进去不影响本次使用 */
    }
  }

  function applyName(name) {
    bagName = name;
    nameEl.textContent = name;   // 一律走 textContent，名字里的标签不会被解析
    nameEl.dataset.len = Array.from(name).length <= 4 ? 'short' : 'long';
  }

  function normalizeName(raw) {
    const cleaned = (raw || '').trim().replace(/\s+/g, ' ');
    return Array.from(cleaned).slice(0, NAME_MAX).join('');
  }

  function openDialog(first) {
    dialogFirst = first;
    dialogOpen = true;
    dialogTitle.textContent = first ? '给沙袋起个名字' : '换个名字接着打';
    dialogDesc.textContent = first
      ? '以后骂的就是它了，名字会印在沙袋上'
      : '改成谁？新名字立刻印到沙袋上';
    nameInput.value = first ? '' : bagName;
    dialog.hidden = false;
    window.setTimeout(() => nameInput.focus(), 30);
  }

  function closeDialog() {
    dialogOpen = false;
    dialog.hidden = true;
    if (nameInput === document.activeElement) nameInput.blur();
  }

  function commitName(raw) {
    const name = normalizeName(raw) || DEFAULT_NAME;
    applyName(name);
    saveName(name);
    closeDialog();
  }

  function dismissDialog() {
    if (dialogFirst) commitName(DEFAULT_NAME);
    else closeDialog();
  }

  dialogForm.addEventListener('submit', (e) => {
    e.preventDefault();
    commitName(nameInput.value);
  });

  nameSkip.addEventListener('click', dismissDialog);

  dialog.addEventListener('pointerdown', (e) => {
    e.stopPropagation();                        // 弹窗里的点击不算出拳，也不触发挥空
    if (e.target === dialog) dismissDialog();    // 点遮罩 = 跳过
  });

  /* ==================== 状态栏 ==================== */

  function updateHUD() {
    comboEl.textContent = String(combo);
    damageEl.textContent = String(totalDamage);
    bestEl.textContent = String(bestCombo);

    // 没在连打时才允许点名字改名，猛戳的时候点它仍然是出拳
    document.body.classList.toggle('idle', combo === 0);

    comboEl.style.color = combo >= 50 ? '#ff6b45'
      : combo >= 25 ? '#ff9d55'
      : combo >= 10 ? '#ffc46b'
      : '#e8ddd4';
  }

  function popCombo() {
    if (!comboEl.animate || reducedMotion) return;
    comboEl.animate(
      [{ transform: 'scale(1.38)' }, { transform: 'scale(1)' }],
      { duration: 180, easing: 'ease-out' }
    );
  }

  /* ==================== 出拳 ==================== */

  function punch(clientX, clientY) {
    const stageRect = stage.getBoundingClientRect();
    const pivotX = stageRect.left + stageRect.width / 2;
    const pivotY = stageRect.top + rig.offsetTop;
    const rigW = rig.offsetWidth;

    // 把点击位置反算回沙袋未旋转时的本地坐标
    const a = angle * Math.PI / 180;
    const vx = clientX - pivotX;
    const vy = clientY - pivotY;
    const localX = vx * Math.cos(a) + vy * Math.sin(a);
    const localY = -vx * Math.sin(a) + vy * Math.cos(a);

    // 连击与伤害
    combo += 1;
    if (combo > bestCombo) bestCombo = combo;
    const now = performance.now();
    lastPunchAt = now;
    comboActive = true;

    const dmg = CONFIG.damageBase + Math.min(combo * CONFIG.damagePerCombo, CONFIG.damagePerComboMax);
    totalDamage += dmg;
    totalHits += 1;

    // 摆动：打左边就往右甩，反之亦然；连击越高冲得越猛
    const dir = localX < 0 ? 1 : -1;
    const impulse = (CONFIG.impulseBase + Math.min(combo - 1, 37) * CONFIG.impulsePerCombo) *
      (1 + (Math.random() * 2 - 1) * CONFIG.impulseJitter);
    angVel = clamp(angVel + dir * impulse, -CONFIG.impulseCap, CONFIG.impulseCap);

    // 画面反馈
    if (!reducedMotion) {
      shakeAmp = Math.min(CONFIG.shakeMax, shakeAmp + CONFIG.shakePerHit + dmg * 0.015);
    }
    spawnDent(localX + rigW / 2, localY - bag.offsetTop);
    spawnChips(clientX - stageRect.left, clientY - stageRect.top);
    applyDamageTint();
    if (totalHits % CONFIG.crackEvery === 0) addCrack();

    playPunch(combo);
    if (tauntDue(combo) && now - lastTauntAt > CONFIG.tauntGap) {
      spawnTaunt(bagName + '，' + pickFrom(LINE_POOL));
    }

    updateHUD();
    popCombo();

    if (!started) {
      started = true;
      hint.classList.add('off');
    }
  }

  function breakCombo() {
    const was = combo;
    combo = 0;
    comboActive = false;
    if (was >= 3) spawnTaunt(pickFrom(BREAK_LINES), true);
    updateHUD();
  }

  /* ==================== 主循环 ==================== */

  let lastFrame = 0;

  function step(dt, now) {
    const acc = -CONFIG.spring * angle - CONFIG.damping * angVel;
    angVel += acc * dt;
    angle = clamp(angle + angVel * dt, -CONFIG.angleCap, CONFIG.angleCap);
    rig.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';

    // 荡到另一侧的一瞬间响一下铁链
    if (Math.abs(prevAngVel) > CONFIG.rattleSpeed && prevAngVel * angVel < 0 &&
        now - lastRattleAt > CONFIG.rattleGap) {
      lastRattleAt = now;
      playRattle();
    }
    prevAngVel = angVel;

    if (comboActive && now - lastPunchAt > CONFIG.comboTimeout) breakCombo();
  }

  function stepShake(dt) {
    if (reducedMotion || shakeAmp < 0.05) {
      if (shakeAmp !== 0) {
        shakeAmp = 0;
        shake.style.transform = '';
      }
      return;
    }
    shakeAmp = Math.max(0, shakeAmp - CONFIG.shakeDecay * shakeAmp * dt);
    const dx = (Math.random() * 2 - 1) * shakeAmp;
    const dy = (Math.random() * 2 - 1) * shakeAmp;
    shake.style.transform = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px)';
  }

  function frame(now) {
    if (!lastFrame) lastFrame = now;
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    step(dt, now);
    stepShake(dt);
    updateChips(dt);

    requestAnimationFrame(frame);
  }

  /* ==================== 输入 ==================== */

  document.addEventListener('pointerdown', (e) => {
    if (dialogOpen) return;
    if (e.target.closest('#mute')) return;
    if (e.target.closest('#bagName') && combo === 0) {
      openDialog(false);                       // 停手时点名字 = 改名
      return;
    }
    if (e.target.closest('#bag')) {
      punch(e.clientX, e.clientY);
    } else {
      playMiss();
    }
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (dialogOpen) {
      if (e.key === 'Escape') dismissDialog();
      return;                                  // 弹窗期间不响应出拳快捷键
    }
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
    if (e.key !== ' ' && e.key !== 'Spacebar' && e.key !== 'Enter') return;
    e.preventDefault();
    const rect = bag.getBoundingClientRect();
    const x = rect.left + rect.width * (0.3 + Math.random() * 0.4);
    const y = rect.top + rect.height * (0.25 + Math.random() * 0.4);
    punch(x, y);
  });

  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest && e.target.closest('#dialog')) return;
    e.preventDefault();
  });

  document.addEventListener('selectstart', (e) => {
    if (e.target.closest && e.target.closest('#dialog')) return;
    e.preventDefault();
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? '开启音效' : '关闭音效');
    if (master && actx) {
      const t = actx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(muted ? 0 : CONFIG.masterGain, t, 0.02);
    } else if (!muted) {
      ensureAudio();
    }
  });

  const savedName = loadSavedName();
  applyName(savedName || DEFAULT_NAME);
  updateHUD();
  requestAnimationFrame(frame);
  if (!savedName) openDialog(true);
})();
</script>
</body>
</html>
